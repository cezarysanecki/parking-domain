spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/parkingdomain
    username: postgres
    password: root
  liquibase:
    change-log: db/changelog/db.changelog-master.xml
  jooq:
    sql-dialect: postgres

job:
  calling-external-cleaning-service-policy-job:
    cron-expression: "0 30 1 * * ?"
  making-requests-valid-job:
    cron-expression: "0 0 1 * * ?"
  activating-reservations-job:
    cron-expression: "0 */1 * * * ?"
  removing-not-used-reservations-job:
    cron-expression: "0 */1 * * * ?"
  notifying-about-releasing-job:
    cron-expression: "0 */5 * * * ?"
  # must fit ParkingOpeningHours: reminders between OCCUPYING_END (00:00) and CLOSING (01:00)
  reminding-about-parking-closing-job:
    cron-expression: "0 */15 0 * * ?"
  # must fit ParkingOpeningHours: at CLOSING (01:00), start of technical break - tow truck is called for vehicles left
  calling-towing-service-after-closing-job:
    cron-expression: "0 0 1 * * ?"

business:
  cleaning:
    number-of-dirty-parking-spots-to-call-external-service: 10
    number-of-drives-away-to-consider-parking-spot-dirty: 20
  parking:
    minutes-to-consider-reservation-active: 60
    minutes-to-consider-reservation-not-used: 15
    minutes-to-release-occupation-because-of-reservations: 30
  requesting:
    creating-time-slots:
      morning-start-hour: 5
      morning-end-hour: 17
      evening-start-hour: 18
      evening-end-hour: 24
  fee:
    price-list:
      currency: USD
      prices:
        not-used-reservation: "50.00"
