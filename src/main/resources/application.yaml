spring:
  datasource:
    url: jdbc:h2:mem:parking-domain
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
  quartz:
    job-store-type: memory
# to configure jdbc read: https://medium.com/turkcell/spring-boot-quartz-scheduler-1-c61bbbafdbbb

job:
  calling-external-cleaning-service-policy-job:
    cron-expression: "0 0 13 * * ?"
  making-requests-valid-job:
    cron-expression: "0 0 1 * * ?"

business:
  cleaning:
    number-of-dirty-parking-spots-to-call-external-service: 2
    number-of-drives-away-to-consider-parking-spot-dirty: 5
  parking:
    minutes-to-consider-reservation-active: 60
  requesting:
    creating-time-slots:
      morning-start-hour: 5
      morning-end-hour: 17
      evening-start-hour: 18
      evening-end-hour: 24
